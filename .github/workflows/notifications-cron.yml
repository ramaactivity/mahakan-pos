name: notifications-cron

# Sesi AE-125 — Hit endpoint /api/cron/notifications dari GitHub Actions
# secara berkala. Endpoint server auto-determine job berdasarkan jam WIB:
#
#   06:00 WIB (23:00 UTC sebelumnya) → attendance-morning
#   08:00 WIB (01:00 UTC) → low-stock-scan
#   20:00 WIB (13:00 UTC) → daily-digest
#
# Sesi AE-131 — Tambahan untuk Operasional Checklist:
#   10:00 WIB tanggal 28  (03:00 UTC) → operasional-monthly-day28
#   19:00 WIB hari Minggu (12:00 UTC) → operasional-weekly-sunday
#   21:00 WIB setiap hari (14:00 UTC) → operasional-daily-closing
#
# Sesi AE-182 — SETIAP JAM endpoint juga menjalankan `journal-sweep`
# (di luar slot jam di atas): retry antrian jurnal gagal + cari transaksi,
# pengeluaran, dan settlement yang jurnalnya belum tercatat lalu posting.
# Jaring pengaman pembukuan, jadi cron ini WAJIB hidup.
#
# Audit AE-187 — jadwal DIPADATKAN dari tiap jam (24 run/hari ≈ 720 menit
# Actions/bulan; tiap run ditagih minimal 1 menit) ke 11 run/hari (≈ 330
# menit/bulan). Repo privat cuma punya 2.000 menit gratis/bulan — kalau
# jatah habis, SEMUA cron mati diam-diam (sweep, settlement, notif).
#
# Jam UTC yang dipilih = union dari SEMUA slot job (getJobForCurrentHour,
# WIB = UTC+7) + cakupan sapuan jurnal max selang 3 jam:
#   18 UTC = 01 WIB cashless-settlement (lookback 3 hari, slot terlewat aman)
#   23 UTC = 06 WIB attendance-morning
#   01 UTC = 08 WIB low-stock-scan
#   03 UTC = 10 WIB operasional-monthly-day28 (tgl 28)
#   12 UTC = 19 WIB operasional-weekly-sunday (Minggu)
#   13 UTC = 20 WIB daily-digest
#   14 UTC = 21 WIB operasional-daily-closing
#   06, 09, 16, 21 UTC = slot tambahan murni untuk journal-sweep
# Sapuan tetap jalan di SETIAP run (jaring pengaman ke-3 setelah after()+
# retry in-process dan retry-queue — AE-186), max jeda antar sapuan 3 jam.
# JANGAN kembali ke "5 * * * *" tanpa hitung ulang menit Actions.
#
# Minute :05 (avoid peak top-of-hour load di GitHub Actions queue).
# Jam-jam selain slot job → endpoint tetap jalan journal-sweep saja.
#
# Required repo secret:
#   CRON_SECRET — string acak, sama dengan Vercel env CRON_SECRET.
#   Generate: openssl rand -hex 32

on:
  schedule:
    - cron: "5 1,3,6,9,12,13,14,16,18,21,23 * * *"
  workflow_dispatch:
    inputs:
      job:
        description: "Override job name (untuk manual testing)"
        required: false
        type: choice
        default: ""
        options:
          - ""
          - "attendance-morning"
          - "low-stock-scan"
          - "daily-digest"
          - "operasional-daily-closing"
          - "operasional-weekly-sunday"
          - "operasional-monthly-day28"
          - "cashless-settlement"
          - "journal-sweep"

permissions:
  contents: read

jobs:
  fire:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Determine endpoint URL
        id: url
        run: |
          if [ -n "${{ inputs.job }}" ]; then
            echo "url=https://mahakan-pos.vercel.app/api/cron/notifications?job=${{ inputs.job }}" >> "$GITHUB_OUTPUT"
          else
            echo "url=https://mahakan-pos.vercel.app/api/cron/notifications" >> "$GITHUB_OUTPUT"
          fi

      - name: Fire cron endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Repo secret CRON_SECRET kosong. Tambah di Settings → Secrets and variables → Actions."
            exit 1
          fi
          set -euxo pipefail
          # -s = silent, -S = show error, --fail-with-body biar curl exit !=0 kalau http error
          response=$(curl -sS --fail-with-body \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Accept: application/json" \
            "${{ steps.url.outputs.url }}")
          echo "$response"
